<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#F3F4FF"/>
  <circle cx="640" cy="110" r="190" fill="none" stroke="#0000FE" stroke-opacity=".06" stroke-width="30"/>
  <!-- work table -->
  <rect x="90" y="110" width="620" height="390" rx="16" fill="#fff" stroke="#E1E1E1" stroke-width="5"/>
  <!-- garment laid flat -->
  <g transform="translate(286 150) scale(1.4)">
    <path d="M30 0 L50 10 Q60 20 70 10 L90 0 L120 32 L104 50 L94 42 L94 160 L26 160 L26 42 L16 50 L0 32 Z" fill="#F3F4FF" stroke="#0000FE" stroke-width="3" stroke-linejoin="round"/>
    <path d="M50 10 L60 30 L70 10" fill="none" stroke="#0000FE" stroke-width="3"/>
  </g>
  <!-- stain under magnifier -->
  <circle cx="370" cy="340" r="20" fill="#C9A227" fill-opacity=".55"/>
  <path d="M408 378 L456 426" stroke="#313131" stroke-width="16" stroke-linecap="round"/>
  <circle cx="370" cy="340" r="52" fill="#fff" fill-opacity=".35" stroke="#313131" stroke-width="10"/>
  <!-- spray bottle -->
  <g transform="translate(140 190)">
    <rect x="20" y="-20" width="30" height="22" fill="#0000FE"/>
    <path d="M14 -20 H62 L76 -44 H24 Z" fill="#313131"/>
    <rect width="70" height="110" rx="12" fill="#0000FE"/>
  </g>
  <!-- safety goggles -->
  <g transform="translate(130 380)" fill="none" stroke="#313131" stroke-width="8">
    <rect x="0" y="0" width="70" height="50" rx="22"/>
    <rect x="90" y="0" width="70" height="50" rx="22"/>
    <path d="M70 22 H90"/>
  </g>
  <!-- protective glove -->
  <g transform="translate(570 150)" fill="#0000FE" fill-opacity=".9">
    <path d="M20 120 V40 Q20 30 30 30 Q40 30 40 40 V20 Q40 10 50 10 Q60 10 60 20 V14 Q60 4 70 4 Q80 4 80 14 V30 Q80 20 90 20 Q100 20 100 30 V120 Z"/>
    <rect x="16" y="116" width="88" height="40" rx="6"/>
  </g>
  <!-- brush -->
  <rect x="560" y="380" width="110" height="26" rx="13" fill="#313131"/>
  <path d="M572 406 V440 M588 406 V440 M604 406 V440 M620 406 V440 M636 406 V440 M652 406 V440" stroke="#9CA3D9" stroke-width="5" stroke-linecap="round"/>
</svg>
